[dependencies]

[package]
  cjc-version = "0.54.3"
  compile-option = "-O2"
  description = "xmpp client"
  link-option = ""
  name = "xmpp4cj"
  output-type = "dynamic"
  src-dir = ""
  target-dir = ""
  version = "0.0.1"
  [package.package-configuration]

[profile]
  [profile.build]
    incremental = true
    lto = ""
  [profile.customized-option]
    debug = "-g -Woff all --error-count-limit all"
    release = "--fast-math -O2 -Woff all"
  [profile.test]
